[package]
name = "clbk-toke-desktop"
version = "0.1.0"
description = "Desktop client CLBK TOKE untuk server bersama"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
