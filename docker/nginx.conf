user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    # Do not log reset tokens in paths or secrets in query strings.
    map $request_uri $log_uri {
        default /;
        ~^/reset-password/ /reset-password/[redacted];
        ~^(?<clbk_log_path>[^?]+) $clbk_log_path;
    }
    log_format clbk '$remote_addr [$time_local] "$request_method $log_uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout clbk;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;
        client_max_body_size 64m;
        include /etc/nginx/clbk-origin.conf;

        add_header X-Content-Type-Options nosniff always;

        # FPM ping bypasses Laravel maintenance, database state and Host checks.
        location = /healthz {
            access_log off;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /healthz;
            fastcgi_pass 127.0.0.1:9000;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_PROXY "";
            # Laravel reads forwarded HTTPS only from TRUSTED_PROXIES.
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 120s;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Stable PWA URLs must revalidate instead of inheriting /build/'s one-year cache.
        location = /build/sw.js {
            try_files $uri =404;
            default_type application/javascript;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /build/manifest.webmanifest {
            try_files $uri =404;
            types { application/manifest+json webmanifest; }
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /offline.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ^~ /pwa/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ^~ /build/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ /\. {
            deny all;
        }

        location ~ \.php(?:$|/) {
            return 404;
        }
    }
}
