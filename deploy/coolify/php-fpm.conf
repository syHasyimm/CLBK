[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
clear_env = no
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 300s
ping.path = /healthz
ping.response = pong
catch_workers_output = yes
; The base image enables FPM access logging. Exclude URL/query reset tokens.
access.format = "%R [%t] %m %s"
