user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Avoid passwords/reset tokens in paths and queries being copied to access logs.
    log_format clbk '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent';
    access_log /dev/stdout clbk;
    sendfile on;
    server_tokens off;
    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;
        client_max_body_size 11m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # FPM ping works during first-install maintenance without querying the DB.
        location = /healthz {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_PROXY "";
            # Only Coolify's HTTPS proxy may expose this container publicly.
            fastcgi_param HTTPS on;
            fastcgi_hide_header X-Powered-By;
            fastcgi_hide_header X-Content-Type-Options;
            fastcgi_hide_header X-Frame-Options;
            fastcgi_hide_header Referrer-Policy;
            fastcgi_hide_header Strict-Transport-Security;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300s;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
        location ~* \.(?:sqlite|sqlite3|db|zip|log|env)$ { deny all; }
    }
}
